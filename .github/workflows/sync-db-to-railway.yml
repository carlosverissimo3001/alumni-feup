name: Sync VM database to Railway

# Copies the VM's Postgres into Railway's, replacing what is there.
#
# Runs on the self-hosted runner, which lives on the VM, so it reaches the
# source database locally - no VPN needed. The dump is streamed directly into
# Railway over the wire and never written to disk or uploaded as an artifact:
# these tables hold personal_email and linkedin_url for ~3000 people, and
# artifacts on a public repository are publicly downloadable.
#
# workflow_dispatch only. A pull_request trigger on a self-hosted runner would
# let a fork run arbitrary code here, and forks never receive secrets anyway.
#
# Required repository secret:
#   RAILWAY_DATABASE_URL - Railway Postgres DATABASE_PUBLIC_URL
#     (railway variables --service Postgres, then copy DATABASE_PUBLIC_URL)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = report only. sync = REPLACE the Railway database."
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - sync
      confirm:
        description: "Type REPLACE-RAILWAY to allow sync mode. Ignored when inspecting."
        type: string
        required: false
        default: ""
      allow_embedding_loss:
        description: "Override the guard that blocks a sync which would destroy ESCO embeddings."
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-db-to-railway
  cancel-in-progress: false

jobs:
  sync:
    name: "Sync (${{ inputs.mode }})"
    runs-on: self-hosted

    env:
      # Never echoed. GitHub masks secrets in logs, but the URLs are also only
      # ever passed to psql/pg_dump via environment, not on the command line,
      # so they cannot leak through a process listing either.
      TARGET_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Guard sync mode
        if: inputs.mode == 'sync'
        run: |
          if [ "${{ inputs.confirm }}" != "REPLACE-RAILWAY" ]; then
            echo "Sync mode requires confirm = REPLACE-RAILWAY. Got something else."
            echo "Re-run with the exact confirmation string, or use inspect mode."
            exit 1
          fi
          echo "Confirmation accepted. The Railway database will be replaced."

      - name: Check the target secret is configured
        run: |
          if [ -z "${TARGET_URL:-}" ]; then
            echo "RAILWAY_DATABASE_URL is not set as a repository secret."
            echo "Get it with: railway variables --service Postgres  (DATABASE_PUBLIC_URL)"
            exit 1
          fi
          echo "Target secret is present."

      - name: Locate the source database URL
        run: |
          set -euo pipefail
          # The API's .env on the VM holds DATABASE_URL for the local Postgres.
          ENV_FILE=~/newAlumniProj/api/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "Expected $ENV_FILE - not found."
            echo "Run the VM Diagnostics workflow to see the actual layout."
            exit 1
          fi

          SOURCE_URL=$(grep -E '^DATABASE_URL=' "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '"'"'"'')
          if [ -z "$SOURCE_URL" ]; then
            echo "No DATABASE_URL line in $ENV_FILE."
            exit 1
          fi

          # Pass forward without printing. ::add-mask:: keeps it out of the log
          # even if a later step echoes it by accident.
          echo "::add-mask::$SOURCE_URL"
          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "Source URL loaded from $ENV_FILE."

      - name: Select a usable pg_dump
        run: |
          set -euo pipefail
          # pg_dump refuses to dump a server newer than itself, and the VM ships
          # only client 14 against a 17.4 server. Prefer a locally installed
          # binary of a high enough major; otherwise borrow the one inside the
          # Postgres container, which matches the server exactly.
          SERVER_MAJOR=$(psql "$SOURCE_URL" -tAc "show server_version_num" | cut -c1-2)
          echo "server major: $SERVER_MAJOR"

          BEST=""; BEST_MAJOR=0
          for candidate in $(command -v pg_dump || true) /usr/lib/postgresql/*/bin/pg_dump; do
            [ -x "$candidate" ] || continue
            major=$("$candidate" --version | grep -oE '[0-9]+' | head -1)
            echo "  $candidate -> major $major"
            if [ "$major" -gt "$BEST_MAJOR" ]; then BEST="$candidate"; BEST_MAJOR="$major"; fi
          done

          if [ -n "$BEST" ] && [ "$BEST_MAJOR" -ge "$SERVER_MAJOR" ]; then
            echo "PG_DUMP=$BEST" >> "$GITHUB_ENV"
            echo "Using local $BEST (major $BEST_MAJOR)."
            exit 0
          fi

          echo "No local pg_dump >= $SERVER_MAJOR (best was $BEST_MAJOR)."
          echo "Falling back to the Postgres container's own binary."

          CONTAINER=$(sudo -n docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null \
                      | grep -iE 'postgres|pgvector' | head -1 | awk '{print $1}')
          if [ -z "$CONTAINER" ]; then
            echo "Could not find a Postgres container either."
            echo "Fix: sudo apt-get install -y postgresql-client-$SERVER_MAJOR"
            exit 1
          fi

          echo "PG_DUMP=sudo -n docker exec -i $CONTAINER pg_dump" >> "$GITHUB_ENV"
          echo "Using container $CONTAINER: $(sudo -n docker exec -i "$CONTAINER" pg_dump --version)"

      - name: Check tooling and connectivity
        run: |
          set -euo pipefail
          echo "--- versions ---"
          echo "pg_dump: ${PG_DUMP}"
          psql --version    || { echo "psql missing on the VM"; exit 1; }

          echo
          echo "--- source (VM, local) ---"
          psql "$SOURCE_URL" -tAc "select version()" | head -1

          echo
          echo "--- target (Railway, outbound) ---"
          # University networks sometimes block non-standard outbound ports;
          # Railway's Postgres proxy does not listen on 443.
          if ! psql "$TARGET_URL" -tAc "select version()" | head -1; then
            echo "Could not reach Railway Postgres from the VM."
            echo "Most likely outbound egress to the proxy port is blocked."
            exit 1
          fi

      - name: Row counts before
        run: |
          set -euo pipefail
          COUNTS="select 'alumni', count(*) from alumni
                  union all select 'role', count(*) from role
                  union all select 'company', count(*) from company
                  union all select 'course', count(*) from course
                  union all select 'location', count(*) from location
                  union all select 'graduation', count(*) from graduation
                  union all select 'migrations', count(*) from _prisma_migrations
                  order by 1"
          echo "--- source (VM) ---"
          psql "$SOURCE_URL" -tA -F' ' -c "$COUNTS" || true
          echo
          echo "--- target (Railway), before ---"
          psql "$TARGET_URL" -tA -F' ' -c "$COUNTS" || echo "(target may be empty)"

      - name: Compare extensions and ESCO embeddings
        run: |
          set -euo pipefail
          # Railway holds ~3000 OpenAI text-embedding-3-large vectors on
          # esco_classification. They cost real money to generate, and
          # agents-api has never run in production on the VM - so the source may
          # not have pgvector installed at all. Surface that before anything
          # destructive happens.
          echo "--- extensions: source (VM) ---"
          psql "$SOURCE_URL" -tA -F' ' -c "select extname, extversion from pg_extension order by 1"
          echo
          echo "--- extensions: target (Railway) ---"
          psql "$TARGET_URL" -tA -F' ' -c "select extname, extversion from pg_extension order by 1"
          echo

          EMB="select count(*) || ' rows, ' || count(embedding) || ' with embeddings'
               from esco_classification"
          echo "esco_classification, source : $(psql "$SOURCE_URL" -tAc "$EMB" 2>/dev/null || echo 'table or column absent')"
          echo "esco_classification, target : $(psql "$TARGET_URL" -tAc "$EMB" 2>/dev/null || echo 'table or column absent')"
          echo
          echo "--- tables on the target that the source lacks ---"
          echo "(--clean will NOT drop these; they survive the restore)"
          comm -13 \
            <(psql "$SOURCE_URL" -tAc "select table_name from information_schema.tables where table_schema='public' order by 1") \
            <(psql "$TARGET_URL" -tAc "select table_name from information_schema.tables where table_schema='public' order by 1") \
            || true

      - name: Guard against destroying embeddings
        if: inputs.mode == 'sync'
        run: |
          set -euo pipefail
          COUNT="select count(embedding) from esco_classification"
          SRC=$(psql "$SOURCE_URL" -tAc "$COUNT" 2>/dev/null || echo 0)
          TGT=$(psql "$TARGET_URL" -tAc "$COUNT" 2>/dev/null || echo 0)
          SRC=${SRC:-0}; TGT=${TGT:-0}
          echo "embeddings - source: $SRC, target: $TGT"

          if [ "$SRC" -lt "$TGT" ]; then
            echo
            echo "The source has fewer ESCO embeddings than the target."
            echo "Syncing would replace $TGT embeddings with $SRC and they would"
            echo "have to be regenerated against the OpenAI API at real cost."
            if [ "${{ inputs.allow_embedding_loss }}" != "true" ]; then
              echo
              echo "Refusing. Re-run with allow_embedding_loss = true if this is intended,"
              echo "or exclude esco_classification from the dump and sync the rest."
              exit 1
            fi
            echo "allow_embedding_loss is set - continuing anyway."
          else
            echo "Source is not behind the target. Safe to proceed."
          fi

      - name: Replace the Railway database
        if: inputs.mode == 'sync'
        run: |
          set -euo pipefail

          # --clean --if-exists emits DROP before each CREATE, so the target is
          # emptied as part of the restore rather than in a separate step.
          # --no-owner/--no-privileges because the roles differ between the VM
          # and Railway; without them every GRANT and ALTER OWNER fails.
          # Deliberately NOT piping pg_dump straight into psql. On a mid-stream
          # pg_dump failure psql sees a clean EOF, has no error to trip
          # ON_ERROR_STOP on, and commits the partial restore - leaving the
          # target half-written. Dumping to a file first means a truncated dump
          # is caught before anything touches Railway.
          #
          # The file stays on the VM, which already holds this data, and is
          # removed in the always() cleanup step below. It is never uploaded.
          DUMP=$(mktemp /tmp/alumni-sync-XXXXXX.sql)
          echo "DUMP_FILE=$DUMP" >> "$GITHUB_ENV"
          chmod 600 "$DUMP"

          echo "pg_dump binary: ${PG_DUMP}"
          # PG_DUMP may be a plain path or a `sudo docker exec ...` prefix, so it
          # is intentionally word-split here rather than quoted.
          # shellcheck disable=SC2086
          ${PG_DUMP} "$SOURCE_URL" \
            --format=plain \
            --clean --if-exists \
            --no-owner --no-privileges \
            --quote-all-identifiers \
            > "$DUMP"

          BYTES=$(stat -c%s "$DUMP")
          echo "dump written: $BYTES bytes"
          if [ "$BYTES" -lt 100000 ]; then
            echo "Dump is implausibly small for ~3300 alumni. Refusing to restore."
            exit 1
          fi
          # pg_dump terminates a complete plain dump with this marker.
          if ! tail -5 "$DUMP" | grep -q "PostgreSQL database dump complete"; then
            echo "Dump has no completion marker - it is truncated. Refusing to restore."
            exit 1
          fi
          echo "Dump looks complete."

          echo "Restoring into Railway. This replaces every table."
          psql "$TARGET_URL" \
            --quiet \
            --set ON_ERROR_STOP=on \
            --single-transaction \
            --file "$DUMP"

          echo "Restore completed."

      - name: Remove the local dump
        if: always()
        run: |
          if [ -n "${DUMP_FILE:-}" ] && [ -f "$DUMP_FILE" ]; then
            shred -u "$DUMP_FILE" 2>/dev/null || rm -f "$DUMP_FILE"
            echo "Removed $DUMP_FILE"
          else
            echo "No dump file to remove."
          fi

      - name: Row counts after
        if: inputs.mode == 'sync'
        run: |
          set -euo pipefail
          COUNTS="select 'alumni', count(*) from alumni
                  union all select 'role', count(*) from role
                  union all select 'company', count(*) from company
                  union all select 'course', count(*) from course
                  union all select 'location', count(*) from location
                  union all select 'graduation', count(*) from graduation
                  union all select 'migrations', count(*) from _prisma_migrations
                  order by 1"
          echo "--- source (VM) ---"
          psql "$SOURCE_URL" -tA -F' ' -c "$COUNTS"
          echo
          echo "--- target (Railway), after ---"
          psql "$TARGET_URL" -tA -F' ' -c "$COUNTS"
          echo
          echo "These two should now agree. If migrations differ, the next API"
          echo "deploy will apply whatever is pending via prisma migrate deploy."
