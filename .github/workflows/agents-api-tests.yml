name: agents-api tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: agents-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pytest is a required status check, so the paths filter cannot live on the
  # trigger: a workflow that never runs never reports, and branch protection
  # waits for it forever. Gating the job instead keeps the check reported, and
  # a skipped required job counts as satisfied.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'agents-api/**'
              - '.github/workflows/agents-api-tests.yml'
              # The suite applies this schema to the test database, and the
              # SQLAlchemy models mirror it, so a schema change can break these
              # tests without touching agents-api.
              - 'api/prisma/schema.prisma'

  test:
    name: pytest
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents-api

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agents_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agents-api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Apply the Prisma schema to the test database
        working-directory: .
        # Pinned to the exact version in api/package.json - a floating major
        # would let CI apply migrations with a different Prisma than the app
        # runs. Keep the two in sync.
        run: npx --yes prisma@6.19.2 migrate deploy --schema api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        # The full ruleset cannot gate app/ yet - it still carries pre-existing
        # E501s, tracked in CAR-163. The F rules can, and they are the ones that
        # catch bugs rather than style: F821 undefined-name shipped a production
        # 500 in #102 precisely because nothing gated it.
        run: |
          uv run ruff check app/ --select F
          uv run ruff check tests/
          uv run ruff format --check tests/

      - name: Run tests
        run: uv run pytest -q
