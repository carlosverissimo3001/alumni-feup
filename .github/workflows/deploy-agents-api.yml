name: Deploy Agents API

# Sibling to deploy-backend.yml (CAR-387). Deploys the agents-api FastAPI
# service and its arq background worker — two separate pm2 processes,
# both running out of the same agents-api/.venv (CAR-389).

on:
  push:
    branches:
      - main
    paths:
      - "agents-api/**"
  workflow_dispatch: {}

# Never let two deploys touch the VM at once.
concurrency:
  group: deploy-agents-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on VM
    runs-on: self-hosted
    environment: Production – alumni-feup

    steps:
      - name: Check agents-api is up before deployment
        run: |
          if ! curl -sf --max-time 10 http://localhost:8000/health; then
            echo "agents-api did not answer /health before deployment."
            echo "Continuing - this just means it was already down."
          fi

      - name: Pull latest code, sync deps, and restart
        run: |
          set -euo pipefail
          cd ~/alumni-feup

          echo "Pulling latest changes..."
          git pull origin main

          cd agents-api

          # requires-python is >=3.12; uv manages this independently of the
          # VM's system Python (3.10) and reuses /usr/bin/python3.12 if present.
          echo "Syncing dependencies..."
          uv sync --python 3.12

          echo "Restarting agents-api and agents-worker..."
          pm2 restart agents-api agents-worker --update-env

      - name: Verify agents-api came back
        run: |
          echo "Waiting for agents-api to be ready..."
          # Generous window: the sentence-transformers model load on boot
          # alone took ~50s during manual testing.
          for i in $(seq 1 45); do
            if curl -s --max-time 5 -o /dev/null http://localhost:8000/health; then
              echo "agents-api is accepting connections."
              exit 0
            fi
            sleep 2
          done

          echo "agents-api did not accept connections within 90s"
          pm2 logs agents-api --lines 50 --nostream
          pm2 logs agents-worker --lines 50 --nostream
          exit 1
